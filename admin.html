<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>段考複習系統｜老師後台</title>
<meta name="robots" content="noindex">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Sora:wght@500;600;700&display=swap">
<style>
/* Layout: a wide working page — header with data-source switch, tabs, then summary tiles over the class table */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --ink:#13294B; --muted:#5D6880; --line:#DDE3EC;
  --accent:#F5B82E; --accent-soft:#FDF1D3; --btn-bg:#13294B; --btn-fg:#FFFFFF;
  --good:#1E8556; --good-soft:#E3F3EA; --bad:#C2453A; --bad-soft:#FBE8E6; --chip:#EBEFF5;
  --f-body:"Noto Sans TC",system-ui,"PingFang TC","Microsoft JhengHei",sans-serif;
  --f-num:"Sora","Noto Sans TC",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0D1422; --surface:#162034; --ink:#E7ECF5; --muted:#9AA6BD; --line:#26324A;
  --accent:#F5C04A; --accent-soft:#3A3220; --btn-bg:#F5C04A; --btn-fg:#13294B;
  --good:#4CC28A; --good-soft:#163A2B; --bad:#F07A6E; --bad-soft:#3E1F1E; --chip:#1F2B42; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.wrap{max-width:1100px;margin:0 auto;padding-inline:20px;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
header h1{font-size:22px;margin:0;flex:1;min-width:200px}
.seg{display:inline-grid;grid-auto-flow:column;background:var(--chip);border-radius:10px;padding:3px;gap:3px}
.seg button{border-radius:8px;padding:6px 14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border-radius:10px;background:var(--btn-bg);color:var(--btn-fg);font-weight:700}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.card{background:var(--surface);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-size:17px;margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.tile{background:var(--surface);border-radius:14px;padding:14px 16px}
.tile b{display:block;font-family:var(--f-num);font-size:28px;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--muted);font-weight:500}
tr.stu{cursor:pointer}
tr.stu:hover td{background:var(--chip)}
tr.detail td{white-space:normal;background:var(--bg)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.num{font-family:var(--f-num)}
.pill{display:inline-block;background:var(--chip);border-radius:99px;padding:1px 10px;font-size:13px;margin:2px}
.pill.bad{background:var(--bad-soft)}
.none{color:var(--muted)}
.crow{display:grid;grid-template-columns:minmax(0,1fr) 120px 44px;gap:10px;align-items:center;font-size:14px}
.crow .num{text-align:right;color:var(--muted)}
.qrow{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-bottom:1px solid var(--line)}
.qrow:last-child{border-bottom:0}
.qrow .meta{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.qrow .rate{color:var(--bad);font-weight:700}
.center{min-height:60vh;display:grid;place-items:center;text-align:center}
.drop{border:2px dashed var(--line);border-radius:14px;padding:24px;text-align:center}
.ok{color:var(--good)} .err{color:var(--bad)}
.stack{display:flex;flex-direction:column;gap:10px}
mjx-container{font-size:105%!important}
</style>
</head>
<body>
<div class="wrap" id="root"><div class="center"><p class="muted">載入中…</p></div></div>

<script>
window.MathJax = {tex:{inlineMath:[["\\(","\\)"]]}, svg:{fontCache:"global"}, options:{enableMenu:false}, startup:{typeset:false}};
</script>

<script src="firebase-config.js"></script>
<script src="concepts.js"></script>
<script src="unit01.js"></script>
<script src="unit02.js"></script>
<script src="unit03.js"></script>
<script src="unit04.js"></script>
<script src="boss.js"></script>
<script src="admin.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js" async></script>
</body>
</html>
