<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>段考複習系統</title>
<meta name="description" content="高一數學段考複習：依題型練習、檢查計算錯誤與觀念攻克。">
<meta name="theme-color" content="#22332D">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one phone-width column, one task per screen.
   風格「黑板」：深綠黑板＋粉筆白、粉筆黃、粉筆粉紅。刻意只做深色版本，晚上看也不刺眼。
   字型用手機內建黑體（iPhone 蘋方、Android 思源黑體、電腦微軟正黑體）。 */
:root{
  --bg:#22332D; --surface:#2B3F38; --ink:#F3F1E8; --muted:#AEBDB5; --line:#405850;
  --accent:#F4D35E; --accent-soft:#3D4A35; --pink:#F28FAD; --on-accent:#1E2B26;
  --btn-bg:#F4D35E; --btn-fg:#1E2B26;
  --good:#9BE3B0; --good-soft:#2F4A3C; --bad:#FF9A8B; --bad-soft:#4A3431;
  --chip:#33493F;
  --f-body:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang TC","Noto Sans TC",sans-serif;
  --r:14px; color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
/* 內容在 #scroller 裡捲動，避免手機往下滑時觸發瀏覽器的「下拉重新整理」 */
#scroller{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:radial-gradient(120% 70% at 30% 0%,#2A3D36 0%,var(--bg) 60%) fixed,var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:440px;margin:0 auto;padding-inline:20px;padding-block:16px 32px;min-height:100%;display:flex;flex-direction:column;gap:20px}
.proto{align-self:center;font-size:12px;letter-spacing:.06em;color:var(--muted);background:var(--chip);padding:2px 10px;border-radius:99px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h1,h2{margin:0;text-wrap:balance;line-height:1.3}
h1{font-size:28px;font-weight:700}
h2{font-size:20px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:var(--r);background:var(--btn-bg);color:var(--btn-fg);font-weight:700;font-size:17px;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.link{color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px;align-self:center;padding:6px}
.stack{display:flex;flex-direction:column;gap:12px}
.grow{flex:1}
/* welcome */
.hero{display:flex;flex-direction:column;align-items:flex-start;gap:16px;padding-top:24px}
.hero img{width:96px;height:96px;border-radius:24px;background:var(--surface);padding:8px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.eyebrow{font-size:13px;letter-spacing:.08em;color:var(--muted);font-weight:500}
.hl{background:linear-gradient(transparent 62%,var(--accent-soft) 62%)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fact{background:var(--surface);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px}
.fact b{font-family:var(--f-num);font-size:22px}
.fact span{font-size:13px;color:var(--muted)}
/* quiz */
.top{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .3s}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;background:var(--chip);color:var(--muted);padding:3px 10px;border-radius:99px;white-space:nowrap}
.chip.supp{background:var(--accent-soft);color:var(--ink)}
.stem{font-size:21px;font-weight:500;line-height:1.7}
.stem .k{font-size:14px;color:var(--muted);display:block;margin-bottom:4px;font-weight:400}
.rt{white-space:nowrap}
.rt>span{border-top:1.6px solid currentColor;padding:0 2px;margin-left:1px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 16px;min-height:56px;font-size:18px;transition:border-color .15s,background .15s}
.opt .mk{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:14px;font-family:var(--f-num);color:var(--muted)}
.opts.multi .opt .mk{border-radius:8px}
.opt.sel{border-color:var(--ink)}
.opt.sel .mk{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .mk{background:var(--good);border-color:var(--good);color:var(--on-accent)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .mk{background:var(--bad);border-color:var(--bad);color:var(--on-accent)}
.opt[disabled]{cursor:default}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tfrow .opt{justify-content:center;font-size:20px;min-height:72px}
.conf{display:flex;flex-direction:column;gap:8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--chip);border-radius:12px;padding:4px;gap:4px}
.seg button{border-radius:9px;padding:8px 4px;font-size:15px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.dock{position:sticky;bottom:0;padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}
/* keypad */
.numbox{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1.5px solid var(--ink);border-radius:var(--r);padding:12px 16px;font-size:28px;min-height:64px}
.numbox .unit{font-size:16px;color:var(--muted)}
.numbox.right{border-color:var(--good);background:var(--good-soft)}
.numbox.wrong{border-color:var(--bad);background:var(--bad-soft)}
.caret{display:inline-block;width:2px;height:28px;background:var(--ink);vertical-align:middle;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{background:var(--surface);border-radius:12px;min-height:52px;font-family:var(--f-num);font-size:22px}
.keys button:active{background:var(--chip)}
/* feedback */
.fb{border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;animation:rise .25s ease-out}
.fb.ok{background:var(--good-soft)}
.fb.no{background:var(--bad-soft)}
.fb h2{display:flex;align-items:center;gap:8px}
.fb.ok h2{color:var(--good)}
.fb.no h2{color:var(--bad)}
.peers{font-size:14px;color:var(--ink);display:flex;align-items:center;gap:8px}
.peers .dots{display:flex}
.peers .dots i{width:18px;height:18px;border-radius:50%;background:var(--muted);opacity:.35;border:2px solid var(--surface);margin-left:-6px}
.peers .dots i:first-child{margin-left:0}
.why{display:flex;flex-direction:column;gap:8px}
.why button{text-align:left;background:var(--surface);border:1.5px solid transparent;border-radius:12px;padding:10px 14px;font-size:15px}
.why button.pick{border-color:var(--ink)}
.why button.key{border-color:var(--good)}
.why button.idk{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.why button.idk.pick{border-style:solid;border-color:var(--ink);color:var(--ink)}
.boss{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border-radius:var(--r);padding:14px 16px;background:var(--btn-bg);color:var(--btn-fg)}
.boss > div > b{display:block;font-size:17px}
.boss .small{display:block;opacity:.85}
.boss .bic{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:var(--accent);color:var(--on-accent)}
.boss .go{flex:none;font-weight:700;background:var(--accent);color:var(--on-accent);border-radius:99px;padding:4px 14px}
.boss.locked{background:var(--surface);color:var(--ink);border:1.5px dashed var(--line)}
.boss.locked .bic{background:var(--chip);font-size:18px}
.boss.locked .bar{display:block;margin-top:6px}
.chip.bosschip{background:var(--btn-bg);color:var(--btn-fg)}
.cardx{background:var(--surface);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.cardx p{margin:0}
.cardx .cex{background:var(--accent-soft);border-radius:8px;padding:8px 10px}
.cardx .cex b{font-size:13px;margin-right:6px}
.exp{background:var(--surface);border-radius:12px;padding:14px;font-size:15px;line-height:1.75;display:flex;flex-direction:column;gap:6px}
.exp b{font-size:13px;letter-spacing:.06em;color:var(--muted);font-weight:500}
.fast{border-top:1px dashed var(--line);padding-top:8px;margin-top:4px}
.share{display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;color:var(--ink);padding:8px;border-radius:10px}
@keyframes rise{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
/* result */
.score{display:flex;align-items:center;gap:20px;background:var(--surface);border-radius:20px;padding:20px}
.ring{position:relative;width:120px;height:120px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .v b{font-family:var(--f-num);font-size:34px}
.ring .v b small{font-size:16px}
.ring .v span{font-size:12px;color:var(--muted)}
.units{display:flex;flex-direction:column;gap:10px}
.urow{display:grid;grid-template-columns:96px 1fr 40px;align-items:center;gap:10px;font-size:14px}
.urow .bar{height:8px}
.urow .bar i{background:var(--accent)}
.urow .num{text-align:right;color:var(--muted)}
.card{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.todo{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.todo li{display:flex;align-items:center;gap:10px;font-size:15px}
.todo li::before{content:"";width:10px;height:10px;border-radius:3px;border:2px solid var(--bad);flex:none}
.note{font-size:14px;background:var(--accent-soft);border-radius:12px;padding:10px 14px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;border-radius:var(--r);background:var(--surface);border:1.5px solid var(--line);font-weight:500;font-size:16px}
.gbtn svg{width:20px;height:20px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,10,8,.6);display:flex;align-items:flex-end;justify-content:center;z-index:10;animation:fade .2s}
.sheet{background:var(--bg);width:100%;max-width:440px;border-radius:22px 22px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;animation:up .25s ease-out}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);align-self:center}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px)}}
.acct{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:var(--r);padding:12px 14px;text-align:left;width:100%;border:1.5px solid var(--line)}
.av{width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:700;flex:none}
.sharecard{border-radius:18px;padding:20px;background:var(--ink);color:var(--bg);display:flex;flex-direction:column;gap:12px}
.sharecard .big{font-family:var(--f-num);font-size:44px;font-weight:700;color:var(--accent);line-height:1}
.sharecard .q{background:rgba(255,255,255,.08);border-radius:12px;padding:12px;font-size:17px}
/* home */
.hello{display:flex;align-items:center;gap:12px}
.hello .grow p:first-child{font-size:14px;color:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode{background:var(--surface);border-radius:var(--r);padding:14px 10px;display:flex;flex-direction:column;gap:6px;text-align:left;border:1.5px solid transparent;min-width:0}
.mode b{font-size:15px}
.mode span{font-size:12px;color:var(--muted);line-height:1.4}
.mode.main{border-color:var(--ink)}
.mode .ic{width:28px;height:28px;border-radius:8px;background:var(--accent-soft);display:grid;place-items:center;font-family:var(--f-num);font-weight:700;font-size:14px}
.goal .bar{height:10px}
.goal .bar i{background:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;z-index:20;max-width:calc(100% - 32px);text-align:center;animation:rise .2s}
mjx-container{font-size:108%!important}
.opt mjx-container,.tfrow mjx-container{margin:0!important}
.stem mjx-container{font-size:112%!important}
.unitrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--bg);border-radius:12px;padding:10px 12px}
.unitrow .un{flex:none;width:32px;height:32px;border-radius:9px;background:var(--accent-soft);display:grid;place-items:center;font-family:var(--f-num);font-weight:700;font-size:14px}
.unitrow b{display:block;font-size:15px}
.unitrow .bar{display:block;height:6px;margin-top:6px}
.unitrow .bar i{background:var(--accent)}
.unitrow.supp{border:1.5px dashed var(--line);background:transparent}
.unitrow.supp .small{display:block}
.card.win{background:var(--good-soft)}
.todo.done li::before{border-color:var(--good);background:var(--good)}
.fast{border-top:1px dashed var(--line);padding-top:8px;margin-top:4px}
.proto.test{background:var(--accent);color:var(--on-accent);font-weight:700}
html.test-site #scroller{border-top:4px solid var(--accent)}
.field{width:100%;min-height:52px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:0 16px;font:inherit;font-size:20px;letter-spacing:.06em}
.field:focus{outline:none;border-color:var(--ink)}
.codebox{text-align:center;font-size:34px;font-weight:700;letter-spacing:.12em;background:var(--accent-soft);border-radius:var(--r);padding:16px;user-select:all}
/* 段考範圍切換 */
.seg.rng{grid-template-columns:1fr 1fr}
.seg.rng button{display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.3;padding:8px 4px}
.seg.rng small{font-size:12px;color:var(--muted);font-weight:400}
.modes.two{grid-template-columns:1fr 1fr}
/* 依題型練習 */
.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.catbtn{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--bg);border-radius:12px;padding:12px;border-top:3px solid var(--line);min-width:0}
.catbtn b{font-size:16px}
.catbtn span{font-size:12px;color:var(--muted);line-height:1.4}
.catbtn .cnt{margin-top:2px}
.catbtn.c0{border-top-color:var(--good)}.catbtn.c1{border-top-color:var(--accent)}.catbtn.c2{border-top-color:var(--pink)}.catbtn.c3{border-top-color:#9CC8FF}
.chip.cat{font-weight:700}
.chip.cat.c0{color:var(--good)}.chip.cat.c1{color:var(--accent)}.chip.cat.c2{color:var(--pink)}.chip.cat.c3{color:#9CC8FF}.chip.cat.cx{color:var(--bad)}
/* 練習檢查錯誤 */
.xbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border-radius:var(--r);padding:14px 16px;background:var(--surface);border:1.5px solid var(--pink)}
.xbtn > div > b{display:block;font-size:17px}
.xbtn .small{display:block;color:var(--muted)}
.xbtn .bic{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:15px;font-weight:700;background:var(--pink);color:var(--on-accent)}
.xbtn .go{flex:none;font-weight:700;color:var(--pink);border:1.5px solid var(--pink);border-radius:99px;padding:3px 12px}
.lines{display:flex;flex-direction:column;gap:8px}
.ln{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;min-height:52px;font-size:17px;min-width:0}
.ln .no{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--muted)}
.ln .lt{min-width:0;flex:1;padding:4px 0;line-height:1.5}
.ln.sel{border-color:var(--ink)}
.ln.sel .no{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.ln.bad{border-color:var(--bad);background:var(--bad-soft)}
.ln.bad .no{background:var(--bad);border-color:var(--bad);color:var(--on-accent)}
.ln.bad.good{border-color:var(--good);background:var(--good-soft)}
.ln.bad.good .no{background:var(--good);border-color:var(--good)}
.ln.wrong{border-style:dashed;border-color:var(--ink)}
.ln.allok{background:transparent;border-style:dashed;color:var(--muted);font-size:15px}
.ln.allok.sel{color:var(--ink);border-style:solid}
.ln[disabled]{cursor:default}
.fixl{padding:4px 0}
/* 數字鍵盤（4 欄：數字、根號、分數線、正負號） */
.keys.k4{grid-template-columns:repeat(4,1fr)}
.keys button.fn{background:var(--chip);font-size:20px}
.numbox .rt>span{border-top-width:2px}
/* 限時挑戰 */
.chalbtn{border-color:var(--accent)}
.chalbtn .bic{background:var(--accent);font-size:20px}
.chalbtn .go{color:var(--accent);border-color:var(--accent)}
.clock{font-size:20px;font-weight:700;background:var(--chip);border-radius:10px;padding:2px 10px;min-width:72px;text-align:center}
.clock.low{background:var(--bad);color:var(--on-accent)}
.qdots{display:flex;flex-wrap:wrap;gap:6px}
.qdot{width:32px;height:32px;border-radius:9px;border:1.5px solid var(--line);font-family:var(--f-num);font-size:14px;color:var(--muted)}
.qdot.ans{background:var(--chip);color:var(--ink)}
.qdot.cur{border-color:var(--accent);color:var(--accent);font-weight:700}
.exdock{display:flex;gap:8px}
.exdock .btn{flex:1}
.chrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--bg);border-radius:12px;padding:10px 12px}
.chrow b{display:block;font-size:15px}
.chrow .small,.chrow .pass{display:block}
.chrow .pass{color:var(--good);font-size:13px;font-weight:700}
.chrow .bar{display:block;height:6px;margin-top:6px}
.chrow .bar i{background:var(--accent)}
.chrow.done .bar i{background:var(--good)}
.chrow .go{flex:none;font-size:12px;color:var(--muted);text-align:right;line-height:1.3}
details.rv{background:var(--surface);border-radius:12px;padding:10px 14px;border-left:4px solid var(--good)}
details.rv.no{border-left-color:var(--bad)}
details.rv summary{display:flex;align-items:center;gap:10px;cursor:pointer;list-style:none}
details.rv summary::-webkit-details-marker{display:none}
details.rv .mk{font-weight:700;color:var(--good)}
details.rv.no .mk{color:var(--bad)}
details.rv[open]{display:flex;flex-direction:column;gap:8px}
details.rv[open] summary{margin-bottom:4px}
.small-stem{font-size:16px}
.ropts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:15px}
.ropts li{display:flex;gap:8px;align-items:center;border:1.5px solid var(--line);border-radius:8px;padding:4px 10px}
.ropts li b{font-size:12px;color:var(--muted)}
.ropts li.ok{border-color:var(--good);background:var(--good-soft)}
.ropts li.no{border-color:var(--bad);background:var(--bad-soft)}
#app details.rv mjx-container{display:inline-block;max-width:100%}
/* 選項、算式行：高度跟著算式（例如分式）長高，一般選項維持同樣的最低高度，不出現捲動箭頭 */
.opt>span:last-child{min-width:0;overflow-wrap:anywhere;padding:2px 0}
.opt,.ln{height:auto}
/* 算式太寬時整條等比例縮小，不出現捲軸（Windows 的捲軸會有上下左右箭頭） */
#app mjx-container{display:inline-block;max-width:100%}
#app mjx-container>svg{max-width:100%;height:auto}
#app .stem,#app .opt,#app .why,#app .exp,#app .fb,#app .ln{min-width:0;max-width:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.mail{color:var(--accent);text-decoration:underline;text-underline-offset:3px;word-break:break-all}
.credit{margin:4px 0 0;text-align:center;font-size:12px;color:var(--muted)}
</style>
